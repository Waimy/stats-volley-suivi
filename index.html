<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1017">
<meta name="description" content="Statistiques de volley en match : effectif, composition, saisie point par point et compte rendu de set.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stats Volley">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>window.__PWA__=true;</script>
<title>Stats Volley HVB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Salle de sport la nuit : fond sombre teinté aux couleurs du club, filet flouté qui ondule derrière des panneaux opaques.
   Écrans de match et de compte rendu = tableau de blocs (grille 12 colonnes) que chacun réorganise ; une colonne au téléphone. */
:root{
  color-scheme:dark;
  --c1:#E8641B; --c2:#1F4E8C; --c1-ink:#160B04; --c2-ink:#FFFFFF;
  --bg:color-mix(in oklab, var(--c2) 16%, #06080B);
  --panel:color-mix(in oklab, var(--c2) 9%, #0F141A);
  --panel-2:color-mix(in oklab, var(--c2) 14%, #18202A);
  --ink:#ECEFF3; --muted:#A1ACB8; --line:color-mix(in oklab, #ECEFF3 13%, transparent); --line-2:color-mix(in oklab, #ECEFF3 24%, transparent);
  --win:#46C686; --win-bg:color-mix(in oklab, #46C686 16%, #0F141A); --lose:#F26D6D; --lose-bg:color-mix(in oklab, #F26D6D 15%, #0F141A);
  --court:color-mix(in oklab, var(--c1) 46%, #22160C); --court-ink:#FFF5EA; --court-line:rgba(255,255,255,.82);
  --warn-bg:#3A3112; --warn:#F2D27A;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
body[data-mode="light"]{
  color-scheme:light;
  --bg:color-mix(in oklab, var(--c2) 7%, #F2F3F5); --panel:#FFFFFF; --panel-2:color-mix(in oklab, var(--c2) 6%, #EDEFF2);
  --ink:#10151B; --muted:#4E5964; --line:rgba(16,21,27,.13); --line-2:rgba(16,21,27,.24);
  --win:#117847; --win-bg:#DCF2E5; --lose:#B32D2D; --lose-bg:#F8E0E0;
  --court:color-mix(in oklab, var(--c1) 55%, #F4D9BC); --court-ink:#2A1607; --court-line:#FFFFFF; --warn-bg:#FFF3CF; --warn:#6E5200;
}
@media (prefers-color-scheme: light){ body[data-mode="auto"]{
  color-scheme:light;
  --bg:color-mix(in oklab, var(--c2) 7%, #F2F3F5); --panel:#FFFFFF; --panel-2:color-mix(in oklab, var(--c2) 6%, #EDEFF2);
  --ink:#10151B; --muted:#4E5964; --line:rgba(16,21,27,.13); --line-2:rgba(16,21,27,.24);
  --win:#117847; --win-bg:#DCF2E5; --lose:#B32D2D; --lose-bg:#F8E0E0;
  --court:color-mix(in oklab, var(--c1) 55%, #F4D9BC); --court-ink:#2A1607; --court-line:#FFFFFF; --warn-bg:#FFF3CF; --warn:#6E5200; }}
*{box-sizing:border-box}
html{background:#06080B}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.5;padding-inline:16px;padding-block:0 120px;min-height:100%}
#bg{position:fixed;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);z-index:0;pointer-events:none;filter:blur(2.5px);opacity:.78}
#app{position:relative;z-index:1}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.4rem;line-height:1;text-transform:uppercase;font-weight:800}
h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)} .small{font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c1);outline-offset:2px}

/* Barre du haut */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:0 16px;background:color-mix(in oklab, var(--bg) 92%, transparent);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:0 18px;align-items:stretch;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;padding:10px 0;font-family:var(--display);font-weight:800;font-size:1.3rem;text-transform:uppercase;letter-spacing:.06em}
.brand .ball{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--c1) 0 33%, var(--c2) 0 66%, var(--ink) 0);flex:none}
.brand small{font-family:var(--body);font-weight:500;font-size:.8rem;letter-spacing:0;text-transform:none;color:var(--muted)}
.steps{display:flex;align-items:stretch}
.step{display:flex;align-items:center;gap:8px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 12px;min-height:52px;font-weight:600}
.step .n{font-family:var(--display);font-weight:800;font-size:1.25rem}
.step[aria-current="step"]{color:var(--ink);border-bottom-color:var(--c1)}
.step.done .n{color:var(--c1)}
.step:disabled{opacity:.4;cursor:not-allowed}
.tools{display:flex;align-items:center;gap:6px;padding:6px 0}
.tbtn{background:none;border:1px solid var(--line-2);color:var(--ink);border-radius:8px;padding:8px 12px;min-height:44px;font-weight:600}
.tbtn[aria-pressed="true"]{background:var(--c1);border-color:var(--c1);color:var(--c1-ink)}

/* Boutons */
.btn{border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);border-radius:8px;padding:12px 16px;min-height:48px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn-primary{background:var(--c1);border-color:var(--c1);color:var(--c1-ink)}
.btn-primary:hover:not(:disabled){border-color:var(--c1);filter:brightness(1.07)}
.btn-ghost{background:transparent}
.btn-sm{min-height:38px;padding:6px 12px;font-size:.92rem}
.btn-lg{min-height:58px;font-size:1.08rem;padding:14px 22px;font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:.03em;text-transform:uppercase}
button:disabled{opacity:.42;cursor:not-allowed}

/* Panneaux */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.intro{display:flex;flex-direction:column;gap:6px;padding-top:14px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.16em;font-size:.95rem;color:var(--c1);font-weight:700}
.intro p{max-width:62ch}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:12px 14px;font-size:.95rem}
.flash{background:var(--panel);border:1px solid var(--c1);border-left-width:6px;border-radius:0 8px 8px 0;padding:12px 14px}
.err{background:var(--lose-bg);color:var(--lose);border-radius:8px;padding:10px 14px;font-weight:600}
.lbl{font-family:var(--display);font-size:.95rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.92rem;color:var(--muted);font-weight:600}
input,select{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;min-height:48px;min-width:0;width:100%}
input[type=checkbox],input[type=radio]{width:auto;min-height:auto}
input[type=color]{padding:4px;width:64px;height:48px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;padding:10px 16px;border-radius:7px;min-height:44px;font-weight:700;color:var(--muted)}
.seg input:checked + span,.seg button[aria-pressed="true"]{background:var(--c1);color:var(--c1-ink)}
.seg input:focus-visible + span{outline:3px solid var(--c1)}
.seg button{border:0;background:none;padding:10px 16px;border-radius:7px;min-height:44px;font-weight:700;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 8px;font-size:.82rem;font-weight:700;background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.chip.win{background:var(--win-bg);color:var(--win);border-color:transparent} .chip.lose{background:var(--lose-bg);color:var(--lose);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* Tableau de blocs */
.board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:start}
.w{grid-column:span var(--span,12);background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;display:flex;flex-direction:column}
.w-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 0;min-height:40px}
.w-t{font-family:var(--display);font-size:.98rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.w-b{padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.w-tools{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.w-tools button{border:1px solid var(--line-2);background:var(--panel-2);border-radius:6px;min-height:36px;min-width:36px;padding:4px 8px;font-weight:700;font-size:.85rem}
.w-tools button[aria-pressed="true"]{background:var(--c1);color:var(--c1-ink);border-color:var(--c1)}
.w-grip{cursor:grab;touch-action:none;display:inline-grid;place-items:center;min-width:44px;min-height:40px;border:1px dashed var(--line-2);border-radius:6px;font-size:1.2rem;user-select:none;-webkit-user-select:none}
.board.editing .w{outline:2px dashed color-mix(in oklab, var(--c1) 60%, transparent);outline-offset:-2px}
.board.editing .w-b{pointer-events:none;opacity:.6}
.w.is-hidden{opacity:.45}
.w-dragging{opacity:.7;outline:3px solid var(--c1)!important;outline-offset:-3px}
.editbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15;background:var(--panel);border:1px solid var(--c1);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
@media (max-width:759px){ .board{grid-template-columns:minmax(0,1fr)} .w{grid-column:auto} h1{font-size:2rem} }

/* Joueurs */
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.jersey{grid-row:span 2;width:58px;height:62px;clip-path:polygon(22% 0,78% 0,100% 18%,88% 34%,88% 100%,12% 100%,12% 34%,0 18%);background:var(--c2);color:var(--c2-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.55rem;padding-top:8px}
.jersey.lib{background:var(--c1);color:var(--c1-ink)}
.pname{font-weight:700;font-size:1.05rem}
.pactions{grid-column:1 / -1;display:flex;gap:8px;margin-top:8px}
.togglechips{display:flex;flex-wrap:wrap;gap:8px}
.togglechips label{position:relative}
.togglechips input{position:absolute;opacity:0;inset:0}
.togglechips span{display:inline-block;border:1px solid var(--line-2);border-radius:6px;padding:8px 12px;min-height:40px;font-weight:600;color:var(--muted)}
.togglechips input:checked + span{background:var(--c2);border-color:var(--c2);color:var(--c2-ink)}
.togglechips input:focus-visible + span{outline:3px solid var(--c1)}
.roster{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:auto 76px minmax(0,1fr) minmax(0,170px) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel-2)}
.rrow.off{opacity:.5}
.rrow .who{font-weight:700}
.rrow input[type=number]{text-align:center;font-family:var(--display);font-weight:800;font-size:1.25rem;padding:6px}
.bigcheck{width:26px!important;height:26px;accent-color:var(--c1)}
.libtog{display:flex;align-items:center;gap:6px;font-size:.92rem;color:var(--muted);font-weight:600}
.libtog input{width:22px;height:22px;accent-color:var(--c1)}
@media (max-width:640px){ .rrow{grid-template-columns:auto 64px minmax(0,1fr);} .rrow select,.rrow .libtog{grid-column:2 / -1} }
.cta{position:fixed;left:0;right:0;bottom:0;z-index:18;background:color-mix(in oklab, var(--panel) 96%, transparent);border-top:1px solid var(--line-2);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.cta-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.cta .hint{color:var(--muted);font-size:.95rem}

/* Terrain */
.court{display:flex;flex-direction:column;border:3px solid var(--court-line);background:var(--court);max-width:520px;width:100%;margin:0 auto;border-radius:4px;overflow:hidden}
.net{height:12px;background:repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 8px), var(--bg);border-bottom:2px solid var(--ink)}
.crow{display:grid;grid-template-columns:repeat(3,1fr)}
.crow.front{border-bottom:3px solid var(--court-line)}
.zone{background:transparent;color:var(--court-ink);border:0;border-right:1px dashed color-mix(in oklab, var(--court-ink) 35%, transparent);min-height:92px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;font:inherit}
.crow .zone:last-child{border-right:0}
.zone .z{position:absolute;top:6px;left:8px;font-size:.75rem;font-weight:700;opacity:.8}
.zone .n{font-family:var(--display);font-weight:800;font-size:1.8rem;line-height:1}
.zone .p{font-size:.85rem;font-weight:600}
.zone .tag{position:absolute;top:6px;right:8px;font-size:.68rem;font-weight:800;background:var(--court-ink);color:var(--court);border-radius:4px;padding:1px 6px;letter-spacing:.04em}
.zone.server{box-shadow:inset 0 0 0 4px var(--court-ink)}
.zone.sel{box-shadow:inset 0 0 0 4px var(--c2);background:color-mix(in oklab, var(--court) 70%, var(--panel))}
.zone.empty .n{font-size:1rem;font-weight:700;opacity:.85}
button.zone{cursor:pointer}
.legend{font-size:.85rem;color:var(--muted);text-align:center}

/* Score et saisie */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px}
.score > div{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.score .team{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.score .pts{font-family:var(--display);font-weight:800;font-size:5rem;line-height:.95;font-variant-numeric:tabular-nums}
.score .sep{font-family:var(--display);font-size:2.4rem;color:var(--muted)}
.servebadge{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c1)}
.servebadge::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c1)}
.servebadge.off{visibility:hidden}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;font-size:.92rem;color:var(--muted)}
.meta b{color:var(--ink)}
.resbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.resbtns button{min-height:116px;border-radius:10px;font-family:var(--display);font-weight:800;font-size:2.3rem;text-transform:uppercase;letter-spacing:.05em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.resbtns small{font-family:var(--body);font-size:.85rem;font-weight:600;text-transform:none;letter-spacing:0}
.b-win{background:var(--win-bg);color:var(--win);border:2px solid var(--win)}
.b-lose{background:var(--lose-bg);color:var(--lose);border:2px solid var(--lose)}
.recep{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.recep button{border:1px solid var(--line-2);background:var(--panel-2);border-radius:8px;min-height:64px;font-family:var(--display);font-size:1.8rem;font-weight:800;line-height:1}
.recep button small{display:block;font-family:var(--body);font-size:.78rem;font-weight:600;margin-top:4px;color:var(--muted)}
.recep button[aria-pressed="true"]{background:var(--c2);border-color:var(--c2);color:var(--c2-ink)}
.recep button[aria-pressed="true"] small{color:var(--c2-ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.opts button{text-align:left;border:1px solid var(--line-2);background:var(--panel-2);border-radius:8px;min-height:60px;padding:10px 14px;line-height:1.25;font-weight:700}
.opts button small{display:block;color:var(--muted);font-size:.8rem;font-weight:500;margin-top:3px}
.opts button:hover:not(:disabled){border-color:var(--ink)}
.opts button[aria-pressed="true"]{border-color:var(--c2);box-shadow:inset 0 0 0 2px var(--c2)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats button{border:1px solid var(--line-2);background:transparent;border-radius:6px;padding:10px 14px;min-height:44px;font-weight:700}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toolbar{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.toolbar button{border:1px solid var(--line-2);background:var(--panel-2);border-radius:8px;min-height:52px;padding:8px 10px;font-weight:700;font-size:.95rem}
.toolbar button[aria-expanded="true"]{background:var(--c2);color:var(--c2-ink);border-color:var(--c2)}
.subpanel{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.journal{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.jl{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.95rem}
.jl:last-child{border-bottom:0}
.jl .sc{font-family:var(--display);font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.jl.g .sc{color:var(--win)} .jl.p .sc{color:var(--lose)}
.jl .mk{font-weight:800;margin-right:4px}
.jl.o{color:var(--muted);font-size:.9rem}
.taps{font-size:.88rem;color:var(--muted)}

/* Compte rendu */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel-2)}
.tile .v{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .l{font-size:.85rem;color:var(--muted)}
.constats{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.constats li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.constats .ic{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.constats .ic.bad{background:var(--lose-bg);color:var(--lose)} .constats .ic.good{background:var(--win-bg);color:var(--win)} .constats .ic.info{background:var(--panel-2);color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:12px;align-items:center}
.bar .bl{font-weight:600;font-size:.95rem}
.bar .bl small{display:block;color:var(--muted);font-size:.8rem;font-weight:500}
.track{display:flex;align-items:center;gap:10px;min-width:0}
.fill{height:20px;border-radius:0 4px 4px 0;background:var(--lose);min-width:3px}
.fill.good{background:var(--win)} .fill.neutral{background:var(--muted)}
.bv{font-family:var(--display);font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.board .bar{grid-template-columns:minmax(0,1fr)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.93rem;font-variant-numeric:tabular-nums}

<script>
/* ===================== Catalogue (identique à Modele.swift) ===================== */
const POSTES = {passeur:'Passeur', pointu:'Pointu', receptionneurAttaquant:'Réceptionneur-attaquant', central:'Central', libero:'Libéro', polyvalent:'Polyvalent'};
const POSTE_COURT = {passeur:'Passeur', pointu:'Pointu', receptionneurAttaquant:'R4', central:'Central', libero:'Libéro', polyvalent:'Poly'};
const CAT_LABEL = {service:'Service', attaque:'Attaque', contre:'Contre', receptionDefense:'Réception / défense', passeRelance:'Passe / relance', fauteTechnique:'Faute technique', sanction:'Sanction', collectif:'Collectif', inconnue:"Je n'ai pas vu"};
const CAUSE_CAT = {ace:'service', serviceGagnant:'service', fauteService:'service', attaqueGagnante:'attaque', blocOut:'attaque', attaqueFaute:'attaque', contreGagnant:'contre', receptionRatee:'receptionDefense', receptionDefenseFaute:'receptionDefense', deuxiemeMainGagnante:'passeRelance', relanceGagnante:'passeRelance', fautePasse:'passeRelance', relanceRatee:'passeRelance', fauteTechnique:'fauteTechnique', sanction:'sanction', mesentente:'collectif', inconnue:'inconnue'};
const DET = {serviceFilet:'Dans le filet', serviceDehors:'Dehors', servicePied:'Faute de pied', delai8s:'Délai de 8 s dépassé', ordreService:'Mauvais serveur', aceNonTouche:'Ace non touché', receptionInjouable:'Touché mais injouable', attaqueDehors:'Dehors', attaqueFilet:'Dans le filet', antenne:'Antenne / hors antennes', doubleTouche:'Double touche', ballonTenu:'Ballon tenu / porté', quatreTouches:'4 touches', toucheFilet:'Touche du filet', ligneCentrale:'Franchissement ligne centrale', invasion:'Invasion au-dessus du filet', faute3m:'Faute des 3 m', fauteLibero:'Faute du libéro', contreArriere:"Contre d'un arrière", contreOuAttaqueSurService:'Contre / attaque sur service', plafondObstacle:'Plafond / obstacle', position:'Position / rotation', cartonRouge:'Carton rouge', retardJeu:'Retard de jeu'};
const SERV_D=['serviceFilet','serviceDehors','servicePied','delai8s'], ATT_D=['attaqueDehors','attaqueFilet','antenne'], PASSE_D=['doubleTouche','ballonTenu'], SANC_D=['cartonRouge','retardJeu'];
const TECH_D=['quatreTouches','toucheFilet','ligneCentrale','invasion','faute3m','fauteLibero','contreArriere','contreOuAttaqueSurService','plafondObstacle','position'];
const O=(cause,camp,attr,details,label,prompt)=>({id:cause+'-'+camp,cause,camp,attr,details,label,prompt:prompt||'',cat:CAUSE_CAT[cause]});
const OPTIONS = {
  gagne:[
    O('ace','nous','serveurAuto',[],'Ace'),
    O('serviceGagnant','nous','serveurAuto',[],'Service gagnant (touché, injouable)'),
    O('attaqueGagnante','nous','obligatoire',[],'Attaque gagnante','Qui a marqué ?'),
    O('blocOut','nous','obligatoire',[],'Bloc-out (sur leur contre)','Qui a attaqué ?'),
    O('contreGagnant','nous','obligatoire',[],'Contre gagnant','Qui a contré ?'),
    O('deuxiemeMainGagnante','nous','obligatoire',[],'Deuxième main gagnante','Qui a joué la 2e main ?'),
    O('relanceGagnante','nous','obligatoire',[],'Relance / free ball qui tombe','Qui a relancé ?'),
    O('fauteService','adversaire','aucune',SERV_D,'Faute de service adverse'),
    O('attaqueFaute','adversaire','aucune',ATT_D,'Attaque adverse dehors / filet'),
    O('receptionDefenseFaute','adversaire','aucune',[],'Défense / free ball adverse ratée'),
    O('fautePasse','adversaire','aucune',PASSE_D,'Faute de passe adverse'),
    O('relanceRatee','adversaire','aucune',[],'Relance adverse ratée'),
    O('fauteTechnique','adversaire','aucune',TECH_D,'Faute technique adverse'),
    O('sanction','adversaire','aucune',SANC_D,'Sanction adverse'),
    O('inconnue','inconnu','aucune',[],"Je n'ai pas vu"),
  ],
  perdu:[
    O('fauteService','nous','serveurAuto',SERV_D,'Faute de service'),
    O('receptionRatee','nous','joueurOuCollectif',['aceNonTouche','receptionInjouable'],'Réception ratée (ace adverse)','Qui était en réception ?'),
    O('attaqueFaute','nous','obligatoire',ATT_D,'Attaque dehors / filet','Qui a attaqué ?'),
    O('receptionDefenseFaute','nous','obligatoire',[],'Défense / free ball ratée','Qui a raté ?'),
    O('fautePasse','nous','obligatoire',PASSE_D,'Faute de passe','Qui a fait la passe ?'),
    O('relanceRatee','nous','obligatoire',[],'Relance ratée','Qui a relancé ?'),
    O('fauteTechnique','nous','facultative',TECH_D,'Faute technique','Qui a fait la faute ?'),
    O('sanction','nous','facultative',SANC_D,'Sanction','Joueur sanctionné ?'),
    O('mesentente','nous','aucune',[],'Mésentente (ballon entre deux)'),
    O('attaqueGagnante','adversaire','facultative',[],'Attaque adverse gagnante','Défenseur en faute ?'),
    O('blocOut','adversaire','facultative',[],'Bloc-out adverse (sur notre contre)','Contreur concerné ?'),
    O('contreGagnant','adversaire','obligatoire',[],"Contré par l'adversaire",'Quel attaquant a été contré ?'),
    O('deuxiemeMainGagnante','adversaire','aucune',[],'Deuxième main adverse'),
    O('relanceGagnante','adversaire','aucune',[],'Relance adverse qui tombe'),
    O('inconnue','inconnu','aucune',[],"Je n'ai pas vu"),
  ]
};
const RECEP_LABEL={3:'Parfaite',2:'Correcte',1:'Difficile',0:'Ace subi'};
const ALL_OPTS = {}; ['gagne','perdu'].forEach(r=>OPTIONS[r].forEach(o=>ALL_OPTS[r+'|'+o.id]=o));
// Raccourcis adaptés à qui sert ; « Je n'ai pas vu » toujours disponible.
function shortcuts(res, service){
  const S={gagne:{nous:['ace-nous','attaqueGagnante-nous','contreGagnant-nous','attaqueFaute-adversaire'],
                  adv:['attaqueGagnante-nous','fauteService-adversaire','contreGagnant-nous','attaqueFaute-adversaire']},
           perdu:{nous:['fauteService-nous','attaqueGagnante-adversaire','contreGagnant-adversaire','attaqueFaute-nous'],
                  adv:['receptionRatee-nous','attaqueGagnante-adversaire','contreGagnant-adversaire','attaqueFaute-nous']}};
  return [...S[res][service],'inconnue-inconnu'];
}
const PRESETS = {
  officiel:{mode:'bestOf', setsGagnants:3, nombreSets:null, pointsParSet:25, pointsDernierSet:15, ecart:2, rempMax:6, tmMax:2},
  amical:{mode:'fixe', setsGagnants:null, nombreSets:4, pointsParSet:25, pointsDernierSet:15, ecart:2, rempMax:null, tmMax:null}
};

/* ===================== Utilitaires ===================== */
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(a,b)=>b?Math.round(a*100/b)+' %':'–';
const KEY='statsvolley.v1';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }

/* ===================== Moteur : rejoue le journal ===================== */
function pointsCible(m, numero){ const R=m.regles; return (R.mode==='bestOf' && numero===2*R.setsGagnants-1) ? R.pointsDernierSet : R.pointsParSet; }
function conv(m,id){ return m.convocations.find(c=>c.id===id); }
function player(id){ return db.players.find(p=>p.id===id); }
function nomC(m,id){ const c=conv(m,id); if(!c) return '?'; const p=player(c.playerId); return '#'+c.numero+' '+(p?p.prenom:'?'); }

// Ce qui se transmet d'un set à l'autre : joueurs blessés (exclus du match) et libéros re-désignés.
function heritage(m, s){
  const idx=m.sets.indexOf(s), h={blesses:new Set(), redes:[]};
  (idx<0?m.sets:m.sets.slice(0,idx)).forEach(x=>x.events.forEach(ev=>{
    if(ev.type==='exceptionnel') h.blesses.add(ev.sortantID);
    if(ev.type==='liberoBlesse') h.blesses.add(ev.liberoID);
    if(ev.type==='liberoRedesigne') h.redes.push(ev.joueurID);
  }));
  return h;
}
function liberosMatch(m, redes){ return [...m.convocations.filter(c=>c.libero).map(c=>c.id), ...redes]; }
function isLib(m, st, id){ return liberosMatch(m, st.redes).includes(id); }
function liberosDispo(m, st){ return liberosMatch(m, st.redes).filter(id=>!st.blesses.has(id)); }
// Joueurs pouvant entrer : pas sur le terrain, pas libéro, pas remplacé par le libéro, pas blessé.
function benchFor(m, st){ return m.convocations.filter(c=>!isLib(m,st,c.id) && !st.pos.includes(c.id) && c.id!==st.libero.replaced && !st.blesses.has(c.id)); }

function replay(m, s, upTo){
  const h=heritage(m,s);
  const st={libLock:false, nous:0, adv:0, service:s.serviceInitial, pos:[...s.formation], libero:{id:s.liberoId||null, on:false, replaced:null},
    subs:0, pairs:{}, starters:new Set(s.formation), played:new Set(s.formation), exc:new Set(), blesses:h.blesses, redes:h.redes, tm:{nous:0,adv:0}, rallies:[], log:[], ended:false};
  const cible=pointsCible(m,s.numero);
  s.events.forEach((ev,i)=>{
    if(upTo!=null && i>=upTo) return;
    const sc=()=>st.nous+'–'+st.adv;
    if(ev.type==='point'){
      const opt=ALL_OPTS[ev.resultat+'|'+ev.cause+'-'+ev.camp];
      st.rallies.push({ev, opt, service:st.service, server: st.service==='nous'?st.pos[0]:null, zone1:st.pos[0], setNum:s.numero});
      let note=''; st.libLock=false;
      if(ev.resultat==='gagne'){ st.nous++; if(st.service==='adv'){ st.service='nous'; note=rotate(m,st); } }
      else { st.adv++; st.service='adv'; }
      let who='';
      if(ev.joueurID) who=' · '+nomC(m,ev.joueurID);
      else if(opt && opt.attr==='joueurOuCollectif') who=' · Collectif';
      const rec=(ev.noteReception!=null && ev.cause!=='receptionRatee')?' · récep. '+ev.noteReception:'';
      st.log.push({i, edit:true, cls: ev.resultat==='gagne'?'g':'p', sc:sc(), txt:(opt?opt.label:ev.cause)+(ev.detail?' ('+DET[ev.detail]+')':'')+who+rec});
      if(note) st.log.push({i, cls:'o', sc:'', txt:note});
    } else if(ev.type==='remplacement'){
      const k=st.pos.indexOf(ev.sortantID); if(k>=0) st.pos[k]=ev.entrantID;
      st.subs++; st.played.add(ev.entrantID);
      if(st.starters.has(ev.sortantID) && !st.pairs[ev.sortantID]) st.pairs[ev.sortantID]={sub:ev.entrantID, back:false};
      else { const starter=Object.keys(st.pairs).find(k=>st.pairs[k].sub===ev.sortantID); if(starter && starter===ev.entrantID) st.pairs[starter].back=true; }
      st.log.push({i, cls:'o', sc:sc(), txt:'Remplacement : '+nomC(m,ev.entrantID)+' entre, '+nomC(m,ev.sortantID)+' sort'});
    } else if(ev.type==='correction'){
      const other=st.pos.indexOf(ev.joueur), before=st.pos[ev.zone];
      if(other>=0) st.pos[other]=before;
      else {
        st.played.add(ev.joueur); st.played.delete(before);
        // Le joueur mal saisi est remplacé dans son rôle : titulaire → titulaire, remplaçant → remplaçant.
        if(st.starters.has(before)){ st.starters.delete(before); st.starters.add(ev.joueur); if(st.pairs[before]){ st.pairs[ev.joueur]=st.pairs[before]; delete st.pairs[before]; } }
        else { const k2=Object.keys(st.pairs).find(k=>st.pairs[k].sub===before); if(k2) st.pairs[k2].sub=ev.joueur; }
      }
      st.pos[ev.zone]=ev.joueur;
      st.log.push({i, cls:'o', sc:sc(), txt:'Correction : zone '+(ev.zone+1)+' = '+nomC(m,ev.joueur)+(other>=0?' (échangé avec '+nomC(m,before)+')':' (à la place de '+nomC(m,before)+', non compté)')});
    } else if(ev.type==='tempsMort'){
      st.tm[ev.camp]++;
      st.log.push({i, cls:'o', sc:sc(), txt:'Temps mort '+(ev.camp==='nous'?'nous':'adversaire')});
    } else if(ev.type==='exceptionnel'){
      const k=st.pos.indexOf(ev.sortantID); if(k>=0) st.pos[k]=ev.entrantID;
      st.blesses.add(ev.sortantID); st.played.add(ev.entrantID); st.exc.add(ev.entrantID);
      st.log.push({i, cls:'o', sc:sc(), txt:'Remplacement exceptionnel (blessure) : '+nomC(m,ev.entrantID)+' entre, '+nomC(m,ev.sortantID)+' sort et ne rejouera plus'});
    } else if(ev.type==='liberoIn'){
      const lid=ev.liberoID||st.libero.id;
      const k=st.pos.indexOf(ev.remplaceID); if(k>=0){ st.pos[k]=lid; st.libero.id=lid; st.libero.on=true; st.libero.replaced=ev.remplaceID; } st.libLock=true;
      st.log.push({i, cls:'o', sc:sc(), txt:'Libéro '+nomC(m,lid)+' entre pour '+nomC(m,ev.remplaceID)});
    } else if(ev.type==='liberoSwap'){
      const from=st.libero.id, k=st.pos.indexOf(from); if(k>=0) st.pos[k]=ev.liberoID; st.libero.id=ev.liberoID; st.libLock=true;
      st.log.push({i, cls:'o', sc:sc(), txt:'Changement de libéro : '+nomC(m,ev.liberoID)+' remplace '+nomC(m,from)});
    } else if(ev.type==='liberoBlesse'){
      st.blesses.add(ev.liberoID);
      let txt='Libéro '+nomC(m,ev.liberoID)+' blessé (ne rejouera plus)';
      if(st.libero.on && st.libero.id===ev.liberoID){
        const k=st.pos.indexOf(ev.liberoID);
        if(ev.par){ st.pos[k]=ev.par; st.libero.id=ev.par; txt+=', '+nomC(m,ev.par)+' le remplace'; }
        else { const back=st.libero.replaced; st.pos[k]=back; st.libero.on=false; st.libero.replaced=null; txt+=', '+nomC(m,back)+' revient'; }
      } else if(st.libero.id===ev.liberoID){ st.libero.id=liberosDispo(m,st)[0]||null; }
      st.log.push({i, cls:'o', sc:sc(), txt});
    } else if(ev.type==='liberoRedesigne'){
      st.redes.push(ev.joueurID); if(!st.libero.on) st.libero.id=ev.joueurID;
      st.log.push({i, cls:'o', sc:sc(), txt:nomC(m,ev.joueurID)+' re-désigné libéro pour la fin du match'});
    } else if(ev.type==='liberoOut'){
      const k=st.pos.indexOf(st.libero.id); const back=st.libero.replaced;
      if(k>=0){ st.pos[k]=back; st.libero.on=false; st.libero.replaced=null; } st.libLock=true;
      st.log.push({i, cls:'o', sc:sc(), txt:'Libéro sort, '+nomC(m,back)+' revient'});
    }
  });
  st.setNum=s.numero;
  st.ended = Math.max(st.nous,st.adv)>=cible && Math.abs(st.nous-st.adv)>=m.regles.ecart;
  st.cible=cible;
  return st;
}
// Rotation horaire : zone 2 → 1, 3 → 2, … , 1 → 6. Le libéro sort seul s'il arrive en zone 4.
function rotate(m, st){
  st.pos.push(st.pos.shift());
  if(st.libero.on && st.pos[3]===st.libero.id){
    st.pos[3]=st.libero.replaced; const back=st.libero.replaced; st.libero.on=false; st.libero.replaced=null; st.libLock=true;
    return 'Rotation : le libéro arrive en zone 4 et sort, '+nomC(m,back)+' revient';
  }
  return '';
}
function matchState(m){
  const w={nous:0,adv:0}; let ended=0; const states=m.sets.map(s=>{ const st=replay(m,s); if(st.ended){ ended++; st.nous>st.adv?w.nous++:w.adv++; } return st; });
  const R=m.regles; let fini=!!m.forceFin;
  if(R.mode==='bestOf' && (w.nous>=R.setsGagnants || w.adv>=R.setsGagnants)) fini=true;
  if(R.mode==='fixe' && R.nombreSets && ended>=R.nombreSets) fini=true;
  return {w, ended, states, fini};
}
function optBlocked(opt, st){
  const serv=['ace','serviceGagnant','fauteService'].includes(opt.cause);
  if(serv && opt.camp==='nous' && st.service!=='nous') return 'on ne sert pas';
  if(serv && opt.camp==='adversaire' && st.service!=='adv') return "l'adversaire ne sert pas";
  if(opt.cause==='receptionRatee' && st.service!=='adv') return 'on est au service';
  return null;
}
// Zones : index 0 = zone 1. Avant = zones 2, 3, 4 ; arrière = zones 1, 5, 6.
const AVANT=[1,2,3];
// Qui peut être désigné pour cette action, selon sa zone et son statut (règles officielles 6×6).
// Renvoie null si le joueur en zone i est éligible, sinon la raison.
function ineligible(o, detail, st, i){
  const id=st.pos[i], avant=AVANT.includes(i), lib=st.libero.on && id===st.libero.id, c=o.cause, camp=o.camp;
  // Contre : seuls les joueurs de la rangée avant contrent (le libéro jamais).
  if((c==='contreGagnant'&&camp==='nous') || (c==='blocOut'&&camp==='adversaire')) return avant?null:'arrière : ne contre pas';
  // 2e main : attaque au-dessus du filet depuis la zone avant → joueur avant uniquement.
  if(c==='deuxiemeMainGagnante') return lib?'libéro':(avant?null:'arrière : interdit devant les 3 m');
  // Attaque (y compris attaque contrée) : tout le monde sauf le libéro ; un arrière attaque derrière les 3 m.
  if((['attaqueGagnante','blocOut','attaqueFaute'].includes(c)&&camp==='nous') || (c==='contreGagnant'&&camp==='adversaire')) return lib?"le libéro n'attaque pas":null;
  if(c==='fauteTechnique'){
    if(detail==='fauteLibero') return lib?null:"ce n'est pas le libéro";
    if(detail==='faute3m') return lib?'libéro : faute du libéro':(avant?'joueur avant':null);
    if(detail==='contreArriere') return lib?'libéro : faute du libéro':(avant?'joueur avant':null);
    if(detail==='position') return 'faute collective';
  }
  return null;
}
function detailBlocked(d, st){
  if(d==='fauteLibero' && !st.libero.on) return "libéro pas en jeu";
  return null;
}
function liberoLocked(st){ return st.libLock; }
// Remplacement exceptionnel : en officiel, seulement si aucun remplacement régulier n'est possible pour ce joueur.
function canExc(m, s, st, out, inn){
  if(!out||!inn) return 'Choisis le joueur blessé et celui qui entre.';
  if(m.type==='officiel'){
    const legal=benchFor(m,st).filter(c=>!canSub(m,s,st,out,c.id));
    if(legal.length) return 'Un remplacement régulier est encore possible ('+legal.map(c=>nomC(m,c.id)).join(', ')+') : il doit être utilisé en priorité.';
  }
  return null;
}
function canSub(m, s, st, out, inn){
  if(!out||!inn) return 'Choisis le joueur qui sort et celui qui entre.';
  if(st.blesses.has(inn)) return 'Joueur blessé : il ne peut plus rejouer de ce match.';
  const R=m.regles;
  if(R.rempMax!=null && st.subs>=R.rempMax) return 'Plus de remplacement possible ('+R.rempMax+' max par set).';
  if(m.type!=='officiel') return null;
  // Joueur entré sur remplacement exceptionnel : seule la limite du nombre de remplacements s'applique.
  if(st.exc.has(out)) return null;
  if(st.starters.has(out)){
    if(st.pairs[out]) return 'Ce titulaire est déjà sorti et revenu : il ne peut plus être remplacé dans ce set.';
    if(st.starters.has(inn)) return "Un titulaire ne peut revenir qu'à la place de son remplaçant.";
    if(st.played.has(inn)) return "Ce joueur a déjà joué ce set : il ne peut entrer qu'à la place de son titulaire.";
    return null;
  }
  const starter=Object.keys(st.pairs).find(k=>st.pairs[k].sub===out);
  if(!starter) return 'Remplacement impossible.';
  if(st.pairs[starter].back) return 'Ce remplacement a déjà été fait.';
  if(inn!==starter) return nomC(m,out)+" ne peut sortir qu'au profit de "+nomC(m,starter)+' (son titulaire).';
  return null;
}

function hexLum(h){ const n=parseInt(h.slice(1),16), c=[n>>16&255,n>>8&255,n&255].map(v=>{ v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); }); return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]; }
const inkFor=h=>hexLum(h)>0.36?'#111418':'#FFFFFF';
function mixHex(a,b,t){ const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16), ch=(n,s)=>n>>s&255;
  return '#'+[16,8,0].map(s=>Math.round(ch(pa,s)+(ch(pb,s)-ch(pa,s))*t).toString(16).padStart(2,'0')).join(''); }
const contrast=(a,b)=>{ const x=hexLum(a), y=hexLum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
// Une couleur de club trop proche du fond (ex. noir sur thème sombre) est éclaircie ou foncée juste assez pour rester visible.
function lisible(h, dark){ const bg=dark?'#0C1015':'#F2F3F5'; let x=h, i=0; while(contrast(x,bg)<2.4 && i<12){ x=mixHex(x, dark?'#FFFFFF':'#000000', .14); i++; } return x; }

/* ===================== Fond animé : un filet de volley flouté qui ondule ===================== */
// Rendu en basse résolution puis agrandi et flouté en CSS : le flou est gratuit et le calcul reste léger sur téléphone.
const BG={raf:0, last:0, scale:.55};
function bgColors(){ const S=db.settings, light=document.body.dataset.mode==='light'||(document.body.dataset.mode==='auto'&&matchMedia('(prefers-color-scheme: light)').matches);
  return {c1:S.c1, c2:S.c2, light, mesh:light?'rgba(16,21,27,.16)':'rgba(236,239,243,.20)', band:light?'rgba(16,21,27,.30)':'rgba(255,255,255,.42)', post:light?'rgba(16,21,27,.22)':'rgba(236,239,243,.18)'}; }
function bgDraw(now){
  const cv=document.getElementById('bg'); if(!cv) return;
  const W=window.innerWidth, H=window.innerHeight, k=BG.scale, w=Math.round(W*k), h=Math.round(H*k);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  const ctx=cv.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,w,h);
  const col=bgColors(), t=(now||0)/1000;
  // Géométrie du filet : bande blanche en haut, maille carrée, bas plus souple que le haut.
  const top=h*.30, netH=Math.max(h*.24, 90*k), cell=Math.max(9*k, w/38), rows=Math.max(6,Math.round(netH/cell)), x0=-cell*2, cols=Math.ceil((w+cell*4)/cell);
  const sway=(x,yr)=>{ // yr : 0 en haut du filet, 1 en bas
    const amp=cell*(.15+.85*yr);
    return [amp*.55*Math.sin(x/w*5.2 - t*.55 + yr*1.3), amp*.9*Math.sin(x/w*3.1 - t*.38 + 0.6) * yr + amp*.25*Math.sin(t*.27)]; };
  const P=(c,r)=>{ const x=x0+c*cell, yr=r/rows, [dx,dy]=sway(x,yr); return [x+dx, top+r*cell+dy]; };
  // Lueur de salle derrière le filet, aux couleurs du club.
  const g=ctx.createRadialGradient(w*.5,top+netH*.4,0,w*.5,top+netH*.4,w*.75);
  g.addColorStop(0, col.c2+(col.light?'22':'38')); g.addColorStop(1, col.c2+'00');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  // Maille.
  ctx.strokeStyle=col.mesh; ctx.lineWidth=Math.max(1,1.4*k*1.6);
  ctx.beginPath();
  for(let r=0;r<=rows;r++){ for(let c=0;c<=cols;c++){ const [x,y]=P(c,r); c?ctx.lineTo(x,y):ctx.moveTo(x,y); } }
  for(let c=0;c<=cols;c++){ for(let r=0;r<=rows;r++){ const [x,y]=P(c,r); r?ctx.lineTo(x,y):ctx.moveTo(x,y); } }
  ctx.stroke();
  // Bande supérieure et bande inférieure.
  const band=(r,thick,color)=>{ ctx.strokeStyle=color; ctx.lineWidth=thick; ctx.beginPath(); for(let c=0;c<=cols;c++){ const [x,y]=P(c,r); c?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke(); };
  band(0, Math.max(3,cell*.55), col.band);
  band(rows, Math.max(2,cell*.25), col.mesh);
  // Antennes aux couleurs du club, de part et d'autre.
  [.12,.88].forEach(fx=>{
    const c=Math.round((w*fx-x0)/cell), [ax]=P(c,0), seg=cell*.9, n=Math.round((netH*1.9)/seg), y1=top-netH*.95;
    for(let i=0;i<n;i++){ ctx.strokeStyle=i%2?(col.light?'rgba(16,21,27,.35)':'rgba(255,255,255,.55)'):col.c1; ctx.globalAlpha=col.light?.55:.75; ctx.lineWidth=Math.max(2,cell*.28);
      const yy=y1+i*seg, lean=sway(ax,.15)[0], tilt=lean*.04; ctx.beginPath(); ctx.moveTo(ax+lean+tilt*(i-n/2),yy); ctx.lineTo(ax+lean+tilt*(i+1-n/2),yy+seg); ctx.stroke(); }
    ctx.globalAlpha=1;
  });
  // Ligne de terrain au sol, très discrète.
  ctx.strokeStyle=col.post; ctx.lineWidth=Math.max(1,2*k); ctx.beginPath(); ctx.moveTo(0,h*.86); ctx.lineTo(w,h*.86); ctx.stroke();
}
function bgLoop(now){
  BG.raf=0;
  if(document.hidden || !db.settings.bgAnim || matchMedia('(prefers-reduced-motion: reduce)').matches){ bgDraw(0); return; }
  if(!BG.last || now-BG.last>=40){ BG.last=now; bgDraw(now); }   // ~25 images/s suffisent pour un mouvement aussi lent
  BG.raf=requestAnimationFrame(bgLoop);
}
function bgStart(){ if(typeof requestAnimationFrame==='undefined') return; if(!BG.raf){ BG.last=0; BG.raf=requestAnimationFrame(bgLoop); } }
try{ document.addEventListener('visibilitychange',()=>{ if(!document.hidden) bgStart(); }); window.addEventListener('resize',()=>{ bgDraw(0); bgStart(); }); }catch(e){}

// Glisser-déposer par la poignée, au doigt comme à la souris (Pointer Events), sans bibliothèque.
function initDrag(){
  if(!ui.edit) return;
  document.querySelectorAll('.board .w-grip').forEach(g=>{
    g.addEventListener('pointerdown', e=>{
      const item=g.closest('.w'), board=item&&item.parentElement; if(!board) return;
      e.preventDefault(); try{ g.setPointerCapture(e.pointerId); }catch(err){}
      item.classList.add('w-dragging');
      const move=ev=>{
        const x=ev.clientX, y=ev.clientY;
        for(const c of [...board.children]){ if(c===item) continue; const r=c.getBoundingClientRect();
          if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom){ const before=fmt()==='compact'?y<r.top+r.height/2:x<r.left+r.width/2; board.insertBefore(item, before?c:c.nextSibling); break; } }
        if(y<90) window.scrollBy(0,-14); else if(y>window.innerHeight-90) window.scrollBy(0,14);
      };
      const up=()=>{ g.removeEventListener('pointermove',move); g.removeEventListener('pointerup',up); g.removeEventListener('pointercancel',up); item.classList.remove('w-dragging');
        const key=board.dataset.board, order=[...board.children].map(c=>c.dataset.w).filter(Boolean), L=layout(key);
        L.sort((p1,p2)=>order.indexOf(p1.id)-order.indexOf(p2.id)); save(); render(); };
      g.addEventListener('pointermove',move); g.addEventListener('pointerup',up); g.addEventListener('pointercancel',up);
    });
  });
}

   <div class="fgrid"><label class="f">Prénom<input id="pf-prenom" value="${esc(p?.prenom)}" autocomplete="off"></label><label class="f">Nom<input id="pf-nom" value="${esc(p?.nom)}" autocomplete="off"></label>
   <label class="f">Numéro habituel<input id="pf-num" type="number" inputmode="numeric" min="0" max="99" value="${p?.numero??''}"></label>
   <label class="f">Poste habituel<select id="pf-poste">${Object.keys(POSTES).map(k=>`<option value="${k}" ${p&&p.poste===k?'selected':''}>${POSTES[k]}</option>`).join('')}</select></label></div>
   <div class="f"><span class="lbl">Autres postes possibles</span><div class="togglechips">${postes}</div></div>
   ${errBox()}
   <div class="row"><button class="btn btn-primary" data-a="p-save">${p?'Enregistrer':'Ajouter le joueur'}</button>${p?'<button class="btn btn-ghost" data-a="p-cancel">Annuler</button>':''}</div></section>
  ${arch.length?`<details class="panel"><summary>Joueurs archivés (${arch.length})</summary><div class="players">${arch.map(card).join('')}</div></details>`:''}
  <div class="cta"><div class="cta-in"><span class="hint">${nonLib>=6?`${act.length} joueurs actifs`:`Il faut au moins 6 joueurs hors libéro (${nonLib} pour l'instant)`}</span>
  <button class="btn btn-primary btn-lg" data-a="go" data-v="match" ${nonLib>=6?'':'disabled'}>Préparer un match →</button></div></div>`;
}

/* ---------- Étape 2a : match et convocation ---------- */
function vMatch(){
  const m=curMatch(), active=matchActif(m), off=ui.newType==='officiel', R=PRESETS[ui.newType];
  const actifs=db.players.filter(p=>p.actif);
  const resume=active?(()=>{ const ms=matchState(m); return `<section class="flash row between"><div><b>Match en cours contre ${esc(m.adversaire)}</b> · sets ${ms.w.nous}–${ms.w.adv}</div><button class="btn btn-primary" data-a="go" data-v="live">Reprendre la saisie</button></section>`; })():'';
  const rules=off?`<p class="muted small">Au meilleur des 5 sets · 25 points (15 au 5e set) · 2 points d'écart · 6 remplacements et 2 temps morts par set.</p>`
   :`<div class="fgrid">
     <label class="f">Format<select id="nm-mode"><option value="bestOf" ${R.mode==='bestOf'?'selected':''}>Au meilleur des sets</option><option value="fixe" ${R.mode==='fixe'?'selected':''}>Nombre de sets fixe</option></select></label>
     <label class="f">Sets gagnants / nombre de sets<input id="nm-sets" type="number" min="1" max="7" value="${R.mode==='bestOf'?R.setsGagnants:R.nombreSets}"></label>
     <label class="f">Points par set<input id="nm-pts" type="number" min="5" max="50" value="${R.pointsParSet}"></label>
     <label class="f">Points du set décisif (« au meilleur »)<input id="nm-ptsd" type="number" min="5" max="50" value="${R.pointsDernierSet}"></label>
     <label class="f">Remplacements / set (vide = illimité)<input id="nm-rmax" type="number" min="0" max="20" value="${R.rempMax??''}"></label>
     <label class="f">Temps morts / set (vide = illimité)<input id="nm-tm" type="number" min="0" max="5" value="${R.tmMax??''}"></label></div>`;
  const opts=p=>[p.poste,...p.postes.filter(x=>x!==p.poste),...Object.keys(POSTES).filter(x=>x!==p.poste&&!p.postes.includes(x))].map(k=>`<option value="${k}">${POSTES[k]}</option>`).join('');
  const rows=actifs.map(p=>`<div class="rrow" id="rr-${p.id}"><input class="bigcheck" type="checkbox" id="cv-chk-${p.id}" checked aria-label="Convoquer ${esc(p.prenom)}">
    <input id="cv-num-${p.id}" type="number" inputmode="numeric" min="0" max="99" value="${p.numero??''}" aria-label="Numéro de ${esc(p.prenom)}">
    <span class="who">${esc(p.prenom)} ${esc(p.nom)}</span>
    <select id="cv-poste-${p.id}" aria-label="Poste de ${esc(p.prenom)} ce match">${opts(p)}</select>
    <label class="libtog"><input type="checkbox" id="cv-lib-${p.id}" ${p.poste==='libero'?'checked':''}>Libéro</label></div>`).join('');
  const nb=actifs.length, nl=actifs.filter(p=>p.poste==='libero').length;
  return resume+intro('Étape 2','Le match','Adversaire, type de match, puis les présents avec leur numéro et leur poste du jour.')+`
  <section class="panel"><div class="fgrid"><label class="f">Adversaire<input id="nm-adv" placeholder="Nom de l'équipe adverse" autocomplete="off"></label>
   <label class="f">Date<input id="nm-date" type="date" value="${new Date().toISOString().slice(0,10)}"></label></div>
   <div class="f"><span class="lbl">Type de match</span><div class="seg" role="radiogroup" aria-label="Type de match">
    <label><input type="radio" name="nm-type" value="officiel" ${off?'checked':''}><span>Officiel</span></label>
    <label><input type="radio" name="nm-type" value="amical" ${off?'':'checked'}><span>Amical</span></label></div></div>
   ${rules}</section>
  <section class="panel"><div class="row between"><h2>Qui joue ?</h2><span class="chip" id="cv-count">${nb} convoqués · ${nl} libéro${nl>1?'s':''}</span></div>
   <p class="muted small">Décoche les absents. 2 libéros maximum.</p>
   <div class="roster">${rows}</div>${errBox()}</section>
  <div class="cta"><div class="cta-in"><span class="hint">Ensuite : le 6 de départ</span><button class="btn btn-primary btn-lg" data-a="m-create">Composer le 6 →</button></div></div>`;
}

/* ---------- Étape 2b : composition du set ---------- */
function compoPool(m){
  const h=heritage(m,null), libs=liberosMatch(m,h.redes);
  return {h, players:m.convocations.filter(c=>!libs.includes(c.id)&&!h.blesses.has(c.id)), libs:m.convocations.filter(c=>libs.includes(c.id)&&!h.blesses.has(c.id))};
}
function initCompo(m){
  const prev=curSet(m), pool=compoPool(m), ok=new Set(pool.players.map(c=>c.id));
  const slots=prev?prev.formation.map(id=>ok.has(id)?id:null):[null,null,null,null,null,null];
  const libOk=prev&&pool.libs.some(c=>c.id===prev.liberoId);
  ui.compo={matchId:m.id, n:m.sets.length+1, slots, sel:null, libero:libOk?prev.liberoId:(pool.libs[0]?.id||null), service:prev?(prev.serviceInitial==='nous'?'adv':'nous'):'nous'};
}
function vCompo(){
  const m=curMatch(); if(!m) return vEquipe();
  if(!ui.compo||ui.compo.matchId!==m.id||ui.compo.n!==m.sets.length+1) initCompo(m);
  const c=ui.compo, pool=compoPool(m), ms=matchState(m), prev=curSet(m), n=c.n;
  const zone=i=>{ const id=c.slots[i], cv=id?conv(m,id):null, pl=cv?player(cv.playerId):null;
    return `<button class="zone${c.sel===i?' sel':''}${id?'':' empty'}" data-a="cz" data-v="${i}" aria-pressed="${c.sel===i}" aria-label="Zone ${i+1}${id?' : '+esc(nomC(m,id)):' vide'}">
      <span class="z">Z${i+1}</span>${i===0&&c.service==='nous'?'<span class="tag">SERT</span>':''}<span class="n">${cv?'#'+cv.numero:'+ Zone '+(i+1)}</span><span class="p">${pl?esc(pl.prenom)+' · '+POSTE_COURT[cv.poste]:''}</span></button>`; };
  const filled=c.slots.filter(Boolean).length;
  const plBtn=cv=>{ const k=c.slots.indexOf(cv.id), pl=player(cv.playerId);
    return `<button data-a="cp" data-v="${cv.id}" aria-pressed="${k>=0}">#${cv.numero} ${esc(pl?pl.prenom:'?')}<small>${POSTES[cv.poste]}${k>=0?' · zone '+(k+1):''}</small></button>`; };
  const prevMsg=prev?(()=>{ const st=replay(m,prev); return `<section class="flash row between"><div><b>Set ${prev.numero} ${st.nous>st.adv?'gagné':'perdu'} ${st.nous}–${st.adv}</b> · sets ${ms.w.nous}–${ms.w.adv}</div><div class="row"><button class="btn btn-sm" data-a="m-report" data-v="${m.id}|${prev.numero}">Compte rendu</button><button class="btn btn-sm btn-ghost" data-a="undo">Annuler le dernier point</button></div></section>`; })():'';
  return prevMsg+intro('Étape 2 · Set '+n,'Le six de départ','Contre '+esc(m.adversaire)+'. Touche une zone puis un joueur, ou touche les joueurs dans l\'ordre des zones 1 à 6.')+`
  <section class="panel"><div class="court" role="group" aria-label="Terrain, notre camp, filet en haut"><div class="net"></div>
   <div class="crow front">${[3,2,1].map(zone).join('')}</div><div class="crow">${[4,5,0].map(zone).join('')}</div></div>
   <p class="legend">Filet en haut · rangée avant : zones 4-3-2 · rangée arrière : zones 5-6-1${c.sel!=null?' · zone '+(c.sel+1)+' sélectionnée':''}</p>
   <div class="row"><button class="btn btn-sm btn-ghost" data-a="c-clear">Vider le terrain</button>${prev?'<button class="btn btn-sm btn-ghost" data-a="c-prev">Reprendre le 6 du set précédent</button>':''}</div></section>
  <section class="panel"><h2>Joueurs disponibles</h2><div class="opts">${pool.players.map(plBtn).join('')}</div>
   ${pool.h.blesses.size?`<p class="small muted">Blessés, exclus du match : ${[...pool.h.blesses].map(id=>esc(nomC(m,id))).join(', ')}.</p>`:''}</section>
  <section class="panel"><div class="fgrid">
   <div class="f"><span class="lbl">Libéro de départ</span><div class="seg">${pool.libs.map(cv=>`<button data-a="c-lib" data-v="${cv.id}" aria-pressed="${c.libero===cv.id}">${esc(nomC(m,cv.id))}</button>`).join('')}<button data-a="c-lib" data-v="" aria-pressed="${!c.libero}">Aucun</button></div></div>
   <div class="f"><span class="lbl">Premier service</span><div class="seg"><button data-a="c-serv" data-v="nous" aria-pressed="${c.service==='nous'}">Nous</button><button data-a="c-serv" data-v="adv" aria-pressed="${c.service==='adv'}">${esc(m.adversaire)}</button></div></div>
  </div>${errBox()}</section>
  <div class="cta"><div class="cta-in"><span class="hint">${filled}/6 zones remplies</span><button class="btn btn-primary btn-lg" data-a="set-start" ${filled===6?'':'disabled'}>Commencer le set ${n} →</button></div></div>`;
}

/* ---------- Étape 3 : saisie (tableau modulable) ---------- */
function vLive(){
  const m=curMatch();
  if(!m) return intro('Étape 3','Saisie','Aucun match en cours.')+`<div><button class="btn btn-primary" data-a="go" data-v="match">Préparer un match</button></div>`;
  const ms=matchState(m), s=curSet(m);
  if(!s) return vCompo();
  const st=ms.states[ms.states.length-1];
  if(st.ended||ms.fini){ ui.view='rapport'; ui.reportMatch=m.id; ui.reportSet=s.numero; return vRapport(); }
  return vBoard('live',{
    score:()=>wScore(m,s,st,ms), saisie:()=>wEntry(m,s,st), terrain:()=>wCourt(m,st),
    actions:()=>wActions(m,s,st), bilan:()=>wBilan(m,s), journal:()=>wJournal(m,st,true)
  });
}
function wScore(m,s,st,ms){
  const R=m.regles, srv=st.service==='nous'?esc(nomC(m,st.pos[0])):esc(m.adversaire);
  const badge=on=>`<span class="servebadge${on?'':' off'}"${on?'':' aria-hidden="true"'}>au service</span>`;
  return `<div class="score" aria-label="Score">
   <div><div class="team">Nous</div><div class="pts">${st.nous}</div>${badge(st.service==='nous')}</div><div class="sep">–</div>
   <div><div class="team" title="${esc(m.adversaire)}">${esc(m.adversaire)}</div><div class="pts">${st.adv}</div>${badge(st.service==='adv')}</div></div>
   <div class="meta"><span>Set <b>${s.numero}</b> · en ${st.cible} pts</span><span>Sets <b>${ms.w.nous}–${ms.w.adv}</b></span><span>Au service : <b>${srv}</b></span></div>
   <div class="meta"><span>Remplacements <b>${st.subs}${R.rempMax!=null?'/'+R.rempMax:''}</b></span><span>Temps morts <b>${st.tm.nous}${R.tmMax!=null?'/'+R.tmMax:''}</b> nous · <b>${st.tm.adv}${R.tmMax!=null?'/'+R.tmMax:''}</b> eux</span></div>`;
}
function wCourt(m,st){
  const cell=i=>{ const id=st.pos[i], c=conv(m,id), p=c?player(c.playerId):null, lib=st.libero.on&&id===st.libero.id;
    return `<div class="zone${i===0&&st.service==='nous'?' server':''}"><span class="z">Z${i+1}</span>${lib?'<span class="tag">LIB</span>':''}${i===0&&st.service==='nous'?'<span class="tag">SERT</span>':''}<span class="n">${c?'#'+c.numero:'?'}</span><span class="p">${p?esc(p.prenom):''} · ${c?POSTE_COURT[c.poste]:''}</span></div>`; };
  return `<div class="court" role="group" aria-label="Terrain, filet en haut"><div class="net"></div>
   <div class="crow front">${[3,2,1].map(cell).join('')}</div><div class="crow">${[4,5,0].map(cell).join('')}</div></div>
   <p class="legend">Filet en haut${st.libero.on?` · libéro en jeu à la place de ${esc(nomC(m,st.libero.replaced))}`:''}</p>`;
}
function wEntry(m,s,st0){
  const e=ui.entry, editing=!!(e&&e.edit!=null), st=editing?replay(m,s,e.edit):st0;
  const last=[...s.events].reverse().find(x=>x.type==='point'&&x.taps);
  const tapsInfo=last?`<p class="taps">Dernier point saisi en ${last.taps} tap${last.taps>1?'s':''}</p>`:'';
  if(!e){
    const recep=(st.service==='adv'&&db.settings.noteRecep)?`<div class="lbl">Réception sur leur service · facultatif</div>
      <div class="recep">${[3,2,1].map(n=>`<button data-a="recep" data-v="${n}" aria-pressed="${ui.recep===n}">${n}<small>${RECEP_LABEL[n]}</small></button>`).join('')}</div>`:'';
    return `${recep}<div class="resbtns"><button class="b-win" data-a="res" data-v="gagne">+ Gagné<small>point pour nous</small></button><button class="b-lose" data-a="res" data-v="perdu">− Perdu<small>point pour eux</small></button></div>${tapsInfo}`;
  }
  const opt=e.opt?ALL_OPTS[e.resultat+'|'+e.opt]:null;
  const nPoint=s.events.slice(0,editing?e.edit:s.events.length).filter(x=>x.type==='point').length+1;
  const head=editing?`<div class="flash">Modification du point n°${nPoint} du set ${s.numero} (score avant : ${st.nous}–${st.adv}). Le résultat est conservé.</div>`:'';
  const crumb=`<div class="crumb"><span class="chip ${e.resultat==='gagne'?'win':'lose'}">${e.resultat==='gagne'?'+ Gagné':'− Perdu'}</span>${e.recep?'<span class="chip">Récep. '+e.recep+'</span>':''}${e.cat&&!opt?'<span aria-hidden="true">›</span><span>'+CAT_LABEL[e.cat]+'</span>':''}${opt?'<span aria-hidden="true">›</span><span>'+esc(opt.label)+'</span>':''}${e.detail?'<span aria-hidden="true">›</span><span>'+DET[e.detail]+'</span>':''}</div>`;
  const sub=o=>o.camp==='inconnu'?'Garde score et rotation justes':o.camp==='nous'?(e.resultat==='gagne'?'Notre action':'Notre faute'):(e.resultat==='gagne'?'Faute adverse':'Action adverse');
  const optBtn=o=>{ const b=optBlocked(o,st); return `<button data-a="opt" data-v="${o.id}" ${b?'disabled':''}>${esc(o.label)}<small>${sub(o)}${b?' · '+b:''}</small></button>`; };
  let body='';
  if(e.step==='option'){
    const opts=OPTIONS[e.resultat];
    if(!e.cat){
      const cats=[...new Set(opts.map(o=>o.cat))].filter(c=>c!=='inconnue');
      body=`<div class="lbl">Le plus fréquent · ${st.service==='nous'?'on est au service':'service adverse'}</div><div class="opts">${shortcuts(e.resultat,st.service).map(id=>optBtn(ALL_OPTS[e.resultat+'|'+id])).join('')}</div>
      <div class="lbl">Autre cause</div><div class="cats">${cats.map(c=>`<button data-a="cat" data-v="${c}">${CAT_LABEL[c]}</button>`).join('')}</div>`;
    } else body=`<div class="opts">${opts.filter(o=>o.cat===e.cat).map(optBtn).join('')}</div><div><button class="btn btn-sm btn-ghost" data-a="cat-back">‹ Toutes les causes</button></div>`;
  } else if(e.step==='detail'){
    body=`<div class="lbl">Précision</div><div class="opts">${opt.details.map(d=>{ const b=detailBlocked(d,st); return `<button data-a="detail" data-v="${d}" ${b?'disabled':''}>${DET[d]}${b?'<small>'+b+'</small>':''}</button>`; }).join('')}<button data-a="detail" data-v="">Passer<small>sans précision</small></button></div>`;
  } else if(e.step==='joueur'){
    const extra=opt.attr==='joueurOuCollectif'?`<button data-a="joueur" data-v="">Collectif<small>ballon entre deux joueurs</small></button>`
      :opt.attr==='facultative'?`<button data-a="joueur" data-v="">Personne<small>pas de faute individuelle</small></button>`:'';
    body=`<div class="lbl">${esc(opt.prompt)}</div><div class="opts">${[3,2,1,4,5,0].map(i=>{ const id=st.pos[i], c=conv(m,id), why=ineligible(opt,e.detail,st,i);
      return `<button data-a="joueur" data-v="${id}" ${why?'disabled':''}>${esc(nomC(m,id))}<small>Zone ${i+1} · ${c?POSTE_COURT[c.poste]:''}${st.libero.on&&id===st.libero.id?' · libéro':''}${why?' · '+why:''}</small></button>`; }).join('')}${extra}</div>`;
  }
  return `${head}${crumb}${body}<div class="row between"><button class="btn btn-sm btn-ghost" data-a="entry-cancel">${editing?'Annuler la modification':'Annuler la saisie'}</button>${editing?'':`<span class="taps">${e.taps} tap${e.taps>1?'s':''}</span>`}</div>`;
}
function wActions(m,s,st){
  const R=m.regles; let panel='';
  if(ui.panel==='sub'){
    const onCourt=st.pos.filter(id=>!(st.libero.on&&id===st.libero.id)), bench=benchFor(m,st);
    panel=`<div class="fgrid"><label class="f">Sort<select id="sub-out"><option value="">—</option>${onCourt.map(id=>`<option value="${id}">${esc(nomC(m,id))}</option>`).join('')}</select></label>
    <label class="f">Entre<select id="sub-in"><option value="">—</option>${bench.map(c=>`<option value="${c.id}">${esc(nomC(m,c.id))} · ${POSTE_COURT[c.poste]}</option>`).join('')}</select></label></div>
    ${errBox()}<div class="row"><button class="btn btn-primary" data-a="sub-ok">Valider le remplacement</button></div>`;
  } else if(ui.panel==='libero'){
    const all=liberosMatch(m,st.redes), dispo=liberosDispo(m,st), locked=liberoLocked(st);
    let p='';
    if(!all.length) p='<p class="muted">Aucun libéro convoqué pour ce match.</p>';
    else if(!dispo.length){
      p=`<div class="note">Plus aucun libéro disponible. Tu peux re-désigner comme libéro, pour la fin du match, un joueur qui n'est pas sur le terrain.</div>
      <label class="f">Nouveau libéro<select id="lib-redes"><option value="">—</option>${benchFor(m,st).map(c=>`<option value="${c.id}">${esc(nomC(m,c.id))}</option>`).join('')}</select></label>
      ${errBox()}<div class="row"><button class="btn btn-primary" data-a="lib-redes">Re-désigner</button></div>`;
    } else {
      if(locked) p+='<div class="note">Un échange doit être joué entre deux changements de libéro (sortie automatique en zone 4 comprise).</div>';
      if(st.libero.on){
        const other=dispo.filter(id=>id!==st.libero.id);
        p+=`<div class="row"><button class="btn btn-primary" data-a="lib-out" ${locked?'disabled':''}>Faire sortir ${esc(nomC(m,st.libero.id))} (${esc(nomC(m,st.libero.replaced))} revient)</button>${other.map(id=>`<button class="btn" data-a="lib-swap" data-v="${id}" ${locked?'disabled':''}>Remplacer par ${esc(nomC(m,id))}</button>`).join('')}</div>`;
      } else {
        p+=`<p class="small muted">Le libéro remplace un arrière (zones 5, 6, 1), jamais en zone 1 quand on sert, et sort seul en arrivant en zone 4.</p>
        ${dispo.length>1?`<label class="f">Libéro qui entre<select id="lib-choice">${dispo.map(id=>`<option value="${id}" ${id===st.libero.id?'selected':''}>${esc(nomC(m,id))}</option>`).join('')}</select></label>`:''}
        <div class="opts">${[4,5,0].map(i=>{ const b=i===0&&st.service==='nous'; return `<button data-a="lib-in" data-v="${st.pos[i]}" ${b||locked?'disabled':''}>Entre pour ${esc(nomC(m,st.pos[i]))}<small>Zone ${i+1}${b?' · au service':''}</small></button>`; }).join('')}</div>`;
      }
      p+=`<div class="lbl">Libéro blessé</div><div class="row">${dispo.map(id=>{ const onC=st.libero.on&&st.libero.id===id, other=dispo.find(x=>x!==id);
        if(!onC) return `<button class="btn btn-sm" data-a="lib-bl" data-v="${id}|">${esc(nomC(m,id))} blessé</button>`;
        return `<button class="btn btn-sm" data-a="lib-bl" data-v="${id}|">${esc(nomC(m,id))} blessé, ${esc(nomC(m,st.libero.replaced))} revient</button>${other?`<button class="btn btn-sm" data-a="lib-bl" data-v="${id}|${other}">${esc(nomC(m,id))} blessé, ${esc(nomC(m,other))} le remplace</button>`:''}`; }).join('')}</div>
      <p class="small muted">Un libéro blessé ne rejoue plus du match.</p>`;
    }
    panel=p;
  } else if(ui.panel==='exc'){
    const onCourt=st.pos.filter(id=>!(st.libero.on&&id===st.libero.id));
    panel=`<p class="small muted">Le joueur blessé sort et ne pourra plus rejouer du match. Non compté dans la limite.${m.type==='officiel'?" En officiel, seulement si aucun remplacement régulier n'est possible pour lui.":''} Libéro blessé : bouton « Libéro ».</p>
    <div class="fgrid"><label class="f">Joueur blessé<select id="exc-out"><option value="">—</option>${onCourt.map(id=>`<option value="${id}">${esc(nomC(m,id))}</option>`).join('')}</select></label>

function wJournal(m,st,editable){

function wBilan(m,s){
  const S=computeStats(m,s.numero), {T,P,loss}=S;
  if(!T.won&&!T.lost) return '';
  const rows=Object.keys(LOSS_LABEL).filter(k=>loss[k]&&k!=='adverse'&&k!=='inconnu').map(k=>({l:LOSS_LABEL[k], v:loss[k]})).sort((a,b)=>b.v-a.v).slice(0,4);
  const pire=Object.keys(P).map(id=>({id,f:fautesJoueur(P[id])})).filter(x=>x.f).sort((a,b)=>b.f-a.f)[0];

   ${rows.length?`<div class="lbl">Nos fautes par geste</div>${bars(rows)}`:'<p class="small muted">Aucune faute directe pour l\'instant.</p>'}

/* ---------- Statistiques ---------- */
function computeStats(m, filter){
  const sets = filter==='all'? m.sets : m.sets.filter(s=>String(s.numero)===String(filter));
  const P={}; m.convocations.forEach(c=>P[c.id]={serv:0, ace:0, att:0, con:0, aut:0, fServ:0, fRec:0, fAtt:0, fDef:0, fPas:0, fTech:0});
  const T={won:0,lost:0,wonUs:0,wonThem:0,lostUs:0,lostThem:0,unk:0,coll:0,so:[0,0],bp:[0,0],taps:[0,0],run:0,runAdv:0};
  const RC={3:[0,0],2:[0,0],1:[0,0],0:[0,0],n:[0,0]};
  const rot={}, causes={gagne:{},perdu:{}}, loss={};
  sets.forEach(s=>{ const st=replay(m,s); let run=0, runA=0;
    st.rallies.forEach(r=>{ const ev=r.ev, o=r.opt, g=ev.resultat==='gagne';
      if(g){ T.won++; if(o.camp==='nous')T.wonUs++; else if(o.camp==='adversaire')T.wonThem++; else T.unk++; run++; runA=0; T.run=Math.max(T.run,run); }
      else { T.lost++; if(o.camp==='nous')T.lostUs++; else if(o.camp==='adversaire')T.lostThem++; else T.unk++; run=0; runA++; T.runAdv=Math.max(T.runAdv,runA);
        const k=lossCat(ev,o); loss[k]=(loss[k]||0)+1; }
      if(r.service==='adv'){ T.so[1]++; if(g) T.so[0]++; const k=ev.noteReception==null?'n':ev.noteReception; RC[k][1]++; if(g) RC[k][0]++; }
      else { T.bp[1]++; if(g) T.bp[0]++; if(r.server&&P[r.server]) P[r.server].serv++; }
      if(ev.taps){ T.taps[0]+=ev.taps; T.taps[1]++; }
      rot[r.zone1]=rot[r.zone1]||{w:0,l:0}; g?rot[r.zone1].w++:rot[r.zone1].l++;
      causes[ev.resultat][o.id]=(causes[ev.resultat][o.id]||0)+1;
      const j=ev.joueurID&&P[ev.joueurID];
      if(!g && o.camp==='nous' && !ev.joueurID) T.coll++;
      if(!j) return;
      if(g && o.camp==='nous'){
        if(['ace','serviceGagnant'].includes(o.cause)) j.ace++; else if(['attaqueGagnante','blocOut'].includes(o.cause)) j.att++; else if(o.cause==='contreGagnant') j.con++; else j.aut++;
      } else if(!g){
        if(o.cause==='fauteService') j.fServ++;
        else if(o.cause==='receptionRatee') j.fRec++;
        else if(o.cause==='attaqueFaute' || (o.cause==='contreGagnant'&&o.camp==='adversaire')) j.fAtt++;
        else if(o.cause==='receptionDefenseFaute' || (['attaqueGagnante','blocOut'].includes(o.cause)&&o.camp==='adversaire')) j.fDef++;
        else if(['fautePasse','relanceRatee'].includes(o.cause)) j.fPas++;
        else if(['fauteTechnique','sanction'].includes(o.cause)) j.fTech++;
      }
    });
  });
  return {P,T,rot,causes,RC,loss};
}
const LOSS_LABEL={service:'Service', reception:'Réception', attaque:'Attaque (dehors, filet, contrée)', defense:'Défense et contre', passe:'Passe et relance', technique:'Fautes techniques et sanctions', collectif:'Mésentente', adverse:'Réussites adverses', inconnu:'Non vus'};
const LOSS_SUB={attaque:'dont attaques contrées', defense:'défenseur ou contreur désigné', adverse:'sans faute de notre part', inconnu:'« je n\'ai pas vu »'};
function lossCat(ev,o){
  if(o.camp==='inconnu') return 'inconnu';
  if(o.camp==='nous') return {fauteService:'service', receptionRatee:'reception', attaqueFaute:'attaque', receptionDefenseFaute:'defense', fautePasse:'passe', relanceRatee:'passe', fauteTechnique:'technique', sanction:'technique', mesentente:'collectif'}[o.cause]||'technique';
  if(o.cause==='contreGagnant') return 'attaque';
  if(['attaqueGagnante','blocOut'].includes(o.cause) && ev.joueurID) return 'defense';
  return 'adverse';
}
const FAUTE_LABEL={fServ:'service', fRec:'réception', fAtt:'attaque', fDef:'défense', fPas:'passe', fTech:'technique'};
function fautesJoueur(j){ return Object.keys(FAUTE_LABEL).reduce((a,k)=>a+j[k],0); }
function detailFautes(j){ return Object.keys(FAUTE_LABEL).filter(k=>j[k]).sort((a,b)=>j[b]-j[a]).map(k=>j[k]+' '+FAUTE_LABEL[k]).join(', '); }
function prenomC(m,id){ const c=conv(m,id), p=c?player(c.playerId):null; return p?p.prenom:'?'; }
function constats(m, S){
  const {P,T,rot,loss}=S, out=[];
  const ours=Object.entries(loss).filter(([k])=>k!=='adverse'&&k!=='inconnu').sort((a,b)=>b[1]-a[1]);
  if(ours.length){ const [k,n]=ours[0]; out.push({t:'bad', s:`${LOSS_LABEL[k]} : première source de points perdus, ${n} sur ${T.lost} (${Math.round(n*100/T.lost)} %).`}); }
  else if(T.lost) out.push({t:'good', s:'Aucun point perdu sur une faute directe de notre part.'});
  const pire=Object.keys(P).map(id=>({id, f:fautesJoueur(P[id])})).filter(x=>x.f>=2).sort((a,b)=>b.f-a.f)[0];
  if(pire) out.push({t:'bad', s:`${prenomC(m,pire.id)} cumule ${pire.f} fautes (${detailFautes(P[pire.id])}).`});
  const fs=Object.values(P).reduce((a,j)=>a+j.fServ,0), sv=T.bp[1];
  if(sv>=5 && fs/sv>=0.2) out.push({t:'bad', s:`${fs} fautes de service sur ${sv} services (${Math.round(fs*100/sv)} %).`});
  const rots=Object.entries(rot).map(([id,r])=>({id,...r,d:r.w-r.l})).sort((a,b)=>a.d-b.d);
  if(rots.length && rots[0].d<=-2) out.push({t:'bad', s:`Rotation la plus coûteuse : ${prenomC(m,rots[0].id)} en zone 1 (${rots[0].w} gagné${rots[0].w>1?'s':''}, ${rots[0].l} perdus).`});
  if(T.so[1]>=5) out.push(T.so[0]/T.so[1]<0.5?{t:'bad', s:`Side-out faible : ${pct(T.so[0],T.so[1])} des points gagnés sur leur service.`}:{t:'good', s:`Bon side-out : ${pct(T.so[0],T.so[1])} des points gagnés sur leur service.`});
  const top=Object.keys(P).map(id=>({id, p:P[id].ace+P[id].att+P[id].con+P[id].aut})).sort((a,b)=>b.p-a.p)[0];
  if(top&&top.p>=2) out.push({t:'good', s:`Meilleur marqueur : ${prenomC(m,top.id)} avec ${top.p} points.`});
  if(T.unk && T.unk/(T.won+T.lost)>=0.2) out.push({t:'info', s:`${T.unk} points non vus : les chiffres sont moins fiables.`});
  return out.slice(0,5);
}
function bars(rows, cls){
  const max=Math.max(1,...rows.map(r=>r.v));
  return `<div class="bars">${rows.map(r=>`<div class="bar"><div class="bl">${r.l}${r.sub?`<small>${r.sub}</small>`:''}</div><div class="track"><div class="fill ${r.cls||cls||''}" style="width:${Math.max(2,Math.round(r.v*100/max))}%"></div><span class="bv">${r.txt??r.v}</span></div></div>`).join('')}</div>`;
}

/* ---------- Compte rendu (tableau modulable) ---------- */
function vRapport(){
  const m=db.matches.find(x=>x.id===ui.reportMatch)||curMatch();
  if(!m) return intro('Compte rendu','Aucun match','');
  const filter=ui.reportSet??'all', ms=matchState(m), S=computeStats(m,filter), {P,T,rot,loss,RC}=S;
  const s=filter==='all'?null:m.sets.find(x=>String(x.numero)===String(filter));
  const st=s?replay(m,s):null;
  const titre=s?`Set ${s.numero}`:'Match complet';
  const res=s?(st.ended?`<span class="chip ${st.nous>st.adv?'win':'lose'}">${st.nous>st.adv?'+ Gagné':'− Perdu'} ${st.nous}–${st.adv}</span>`:`<span class="chip">En cours ${st.nous}–${st.adv}</span>`)
    :`<span class="chip ${ms.fini?(ms.w.nous>ms.w.adv?'win':'lose'):''}">Sets ${ms.w.nous}–${ms.w.adv}${ms.fini?'':' · en cours'}</span>`;
  const pick=`<div class="setpick">${m.sets.map(x=>`<button data-a="rep-set" data-v="${x.numero}" aria-current="${String(filter)===String(x.numero)}">Set ${x.numero}</button>`).join('')}<button data-a="rep-set" data-v="all" aria-current="${filter==='all'}">Match complet</button></div>`;
  const isCur=m.id===db.currentMatchId, last=curSet(m), lastSt=last?replay(m,last):null;
  const canNext=isCur && !ms.fini && lastSt && lastSt.ended;
  const editing=isCur && ui.entry && ui.entry.edit!=null ? `<section class="panel">${wEntry(m,last,lastSt)}</section>` : '';
  const ic={bad:'!', good:'✓', info:'i'};
  const noted=[3,2,1,0].reduce((a,k)=>a+RC[k][1],0), sum=[3,2,1,0].reduce((a,k)=>a+k*RC[k][1],0);
  const board=vBoard('rapport',{
    constats:()=>{ const cs=constats(m,S); return cs.length?`<ul class="constats">${cs.map(c=>`<li><span class="ic ${c.t}" aria-hidden="true">${ic[c.t]}</span><span>${esc(c.s)}</span></li>`).join('')}</ul>`:'<p class="muted">Pas encore assez de points pour tirer des conclusions.</p>'; },
    chiffres:()=>`<div class="tiles">
      <div class="tile"><div class="v">${T.won}–${T.lost}</div><div class="l">Points gagnés – perdus</div></div>
      <div class="tile"><div class="v">${pct(T.so[0],T.so[1])}</div><div class="l">Side-out (${T.so[0]}/${T.so[1]})</div></div>
      <div class="tile"><div class="v">${pct(T.bp[0],T.bp[1])}</div><div class="l">Break-point (${T.bp[0]}/${T.bp[1]})</div></div>
      <div class="tile"><div class="v">${T.run} / ${T.runAdv}</div><div class="l">Plus longue série nous / eux</div></div>
      ${noted?`<div class="tile"><div class="v">${(sum/noted).toFixed(1)}</div><div class="l">Réception moyenne (sur 3)</div></div>`:''}</div>`,
    pertes:()=>{ if(!T.lost) return ''; const rows=Object.keys(LOSS_LABEL).filter(k=>loss[k]).map(k=>({l:LOSS_LABEL[k], sub:LOSS_SUB[k], v:loss[k], txt:`${loss[k]} · ${Math.round(loss[k]*100/T.lost)} %`, cls:(k==='adverse'||k==='inconnu')?'neutral':''})).sort((a,b)=>(a.cls?1:0)-(b.cls?1:0)||b.v-a.v);
      return bars(rows)+`<p class="small muted">Gagnés : ${T.wonUs} sur nos actions, ${T.wonThem} sur leurs fautes.</p>`; },
    fautes:()=>{ const fj=Object.keys(P).map(id=>({id,f:fautesJoueur(P[id])})).filter(x=>x.f).sort((a,b)=>b.f-a.f).slice(0,6);
      return fj.length?bars(fj.map(x=>({l:esc(nomC(m,x.id)), sub:detailFautes(P[x.id]), v:x.f}))):''; },
    points:()=>{ const pj=Object.keys(P).map(id=>({id,p:P[id].ace+P[id].att+P[id].con+P[id].aut})).filter(x=>x.p).sort((a,b)=>b.p-a.p).slice(0,6);
      return pj.length?bars(pj.map(x=>({l:esc(nomC(m,x.id)), sub:[P[x.id].att&&P[x.id].att+' attaque',P[x.id].ace&&P[x.id].ace+' service',P[x.id].con&&P[x.id].con+' contre',P[x.id].aut&&P[x.id].aut+' autre'].filter(Boolean).join(', '), v:x.p})),'good'):''; },
    rotations:()=>{ const rots=Object.entries(rot).map(([id,r])=>({id,...r,d:r.w-r.l})).sort((a,b)=>a.d-b.d); if(!rots.length) return '';
      return `<p class="small muted">Repérée par le joueur en zone 1 au début de l'échange.</p><div class="tbl-wrap"><table><thead><tr><th>Zone 1</th><th class="num">Gagnés</th><th class="num">Perdus</th><th class="num">Solde</th></tr></thead><tbody>
      ${rots.map((r,k)=>`<tr${k===0&&r.d<0?' class="worst"':''}><td>${esc(nomC(m,r.id))}${k===0&&r.d<0?' <b>(la plus coûteuse)</b>':''}</td><td class="num">${r.w}</td><td class="num">${r.l}</td><td class="num">${r.d>0?'+':''}${r.d}</td></tr>`).join('')}</tbody></table></div>`; },
    reception:()=>noted?`<div class="tbl-wrap"><table><thead><tr><th>Réception</th><th class="num">Échanges</th><th class="num">Gagnés</th><th class="num">Side-out</th></tr></thead><tbody>
      ${[3,2,1,0,'n'].filter(k=>RC[k][1]).map(k=>`<tr><td>${k==='n'?'Non notée':k+' · '+RECEP_LABEL[k]}</td><td class="num">${RC[k][1]}</td><td class="num">${RC[k][0]}</td><td class="num">${pct(RC[k][0],RC[k][1])}</td></tr>`).join('')}</tbody></table></div>`:'',
    journal:()=>s&&isCur&&s===last?wJournal(m,st,true):''
  });
  const actions=`<div class="cta"><div class="cta-in">${isCur&&last&&!ms.fini?'<button class="btn btn-ghost" data-a="undo">↶ Annuler le dernier point</button>':'<span></span>'}
    ${canNext?`<button class="btn btn-primary btn-lg" data-a="next-set">Préparer le set ${m.sets.length+1} →</button>`
     :ms.fini?`<button class="btn btn-primary btn-lg" data-a="go" data-v="match">Nouveau match →</button>`
     :isCur?`<button class="btn btn-primary btn-lg" data-a="go" data-v="live">Retour à la saisie →</button>`:`<button class="btn btn-primary btn-lg" data-a="go" data-v="historique">Historique</button>`}</div></div>`;
  return editing+intro('Compte rendu · '+esc(m.adversaire), titre+' '+res, '')+pick+board+`<div><button class="btn btn-sm btn-ghost" data-a="m-stats" data-v="${m.id}">Tableau détaillé par joueur</button></div>`+actions;
}

function vStats(){
  const m=db.matches.find(x=>x.id===ui.statsMatch)||curMatch();
  if(!m) return intro('Stats','Aucun match','');
  const {P,T}=computeStats(m, ui.statsSet);
  const pick=`<div class="setpick">${['all',...m.sets.map(s=>s.numero)].map(v=>`<button data-a="st-set" data-v="${v}" aria-current="${String(ui.statsSet)===String(v)}">${v==='all'?'Match complet':'Set '+v}</button>`).join('')}</div>`;
  const rows=m.convocations.map(c=>{ const j=P[c.id], p=player(c.playerId), pts=j.ace+j.att+j.con+j.aut, f=fautesJoueur(j);
    if(!pts&&!f&&!j.serv) return '';
    return `<tr><td>#${c.numero} ${esc(p?p.prenom+' '+p.nom:'?')}</td><td>${POSTE_COURT[c.poste]}</td><td class="num">${j.serv}</td><td class="num">${j.ace}</td><td class="num">${j.att}</td><td class="num">${j.con}</td><td class="num">${j.aut}</td><td class="num"><b>${pts}</b></td>
    <td class="num">${j.fServ}</td><td class="num">${j.fRec}</td><td class="num">${j.fAtt}</td><td class="num">${j.fDef}</td><td class="num">${j.fPas}</td><td class="num">${j.fTech}</td><td class="num"><b>${f}</b></td><td class="num"><b>${pts-f>0?'+':''}${pts-f}</b></td></tr>`; }).join('');
  return intro('Stats détaillées · '+esc(m.adversaire),'Par joueur','')+pick+`<section class="panel"><div class="tbl-wrap"><table><thead><tr><th>Joueur</th><th>Poste</th><th class="num">Services</th><th class="num">Aces*</th><th class="num">Pts att.</th><th class="num">Contres</th><th class="num">Autres</th><th class="num">Total pts</th><th class="num">F. serv.</th><th class="num">F. récep.</th><th class="num">F. att.**</th><th class="num">F. déf.</th><th class="num">F. passe</th><th class="num">F. tech.</th><th class="num">Total F.</th><th class="num">Solde</th></tr></thead><tbody>${rows||'<tr><td colspan="16" class="muted">Pas encore de données.</td></tr>'}</tbody></table></div>

}

function joursDepuis(t){ return t?Math.floor((Date.now()-t)/86400000):null; }
function vBackupReminder(){

function vSauvegarde(){

    <p class="small muted">« Ajouter » garde tes données et ajoute les joueurs et matchs absents (idéal pour regrouper deux appareils). « Remplacer » efface tout ce qui est sur cet appareil.</p></div>`:'';
  return `<section class="panel"><h2>Sauvegarde</h2>
   <p class="small muted">Les données restent sur cet appareil. Exporte un fichier pour les mettre à l'abri ou les passer sur un autre appareil (AirDrop, mail, Drive…). Dernière sauvegarde : <b>${d===null?'jamais':d===0?'aujourd\'hui':'il y a '+d+' jour'+(d>1?'s':'')}</b>.</p>
   <div class="row"><button class="btn btn-primary" data-a="export">Exporter une sauvegarde</button>
   <label class="btn" style="display:inline-flex;align-items:center;cursor:pointer">Importer un fichier<input type="file" id="imp-file" accept="application/json,.json" style="position:absolute;opacity:0;width:1px;height:1px"></label></div>
